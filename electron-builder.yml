appId: com.specter.browser
productName: SPECTER
copyright: Copyright © 2026 SPECTER contributors
directories:
  buildResources: build
  output: release
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
asarUnpack:
  - resources/**
extraMetadata:
  main: out/main/index.js
win:
  executableName: SPECTER
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  fileAssociations:
    - ext: [html, htm, xhtml, svg, pdf]
      name: Web document
      description: Web document
      role: Viewer
  protocols:
    - name: Web URL
      schemes: [http, https]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SPECTER
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: SPECTER-Setup-${version}.${ext}
portable:
  artifactName: SPECTER-Portable-${version}.${ext}
linux:
  target: [AppImage]
  category: Network
  icon: build/icon.png
mac:
  target: [dmg]
  category: public.app-category.productivity
npmRebuild: false
# Auto-updates (electron-updater): generates release/latest.yml + the installer
# .blockmap and bakes resources/app-update.yml into the app. Upload
# SPECTER-Setup-<version>.exe, its .blockmap and latest.yml to the GitHub
# release (tag v<version>). Builds are unsigned: no publisherName is written, so
# electron-updater skips signature verification (it verifies automatically once
# builds are code-signed).
publish:
  provider: github
  owner: martex-dev
  repo: specter
  releaseType: release
